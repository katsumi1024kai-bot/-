<title>53武器クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one column RPG screen. Home = title, status window, big "出発" button, world map of 5 stages. Battle = HUD, monster arena, message window, ○✕ buttons. Result = rank window. Single night-dungeon world (dark only, by choice). */
:root{
  --night:#0b1030;
  --night2:#141b4a;
  --win:#0f163b;
  --win2:#18215a;
  --frame:#eef1ff;
  --edge:#04061a;
  --ink:#f3f5ff;
  --muted:#a9b1dd;
  --gold:#ffd04d;
  --hit:#43e6a2;
  --miss:#ff5c7a;
  --s1:#a684ff; --s2:#5fd68f; --s3:#ffb547; --s4:#5aa9ff; --s5:#ff86bd; --s6:#6fe7ff;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2766 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pix{font-family:var(--pix);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.win{position:relative;background:linear-gradient(180deg,var(--win2),var(--win));border:3px solid var(--frame);border-radius:12px;box-shadow:0 0 0 3px var(--edge),0 12px 28px rgba(0,0,0,.45);padding:14px 16px}
.win-title{position:absolute;top:-13px;left:14px;font-family:var(--pix);font-size:13px;background:var(--win2);padding:0 8px;color:var(--gold);letter-spacing:.08em}

/* ---------- home ---------- */
.logo{text-align:center;padding-top:6px}
.kicker{font-family:var(--pix);color:var(--gold);letter-spacing:.32em;font-size:14px}
.logo h1{font-family:var(--pix);font-weight:400;font-size:clamp(36px,11vw,56px);line-height:1.08;margin:6px 0 0;color:#fff;text-shadow:3px 3px 0 #3a23a0,6px 6px 0 var(--edge);text-wrap:balance}
.logo h1 .n{color:var(--gold);font-size:1.22em;text-shadow:3px 3px 0 #b4500f,6px 6px 0 var(--edge)}
.logo .float{display:inline-block;animation:float 3.2s ease-in-out infinite}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.status .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.status .v{font-family:var(--pix);font-size:28px;line-height:1.2}
.status .v small{font-size:13px;color:var(--muted);margin-left:2px}
.status .v.gold{color:var(--gold)}
.cta{display:block;width:100%;font-family:var(--pix);font-size:28px;line-height:1.2;padding:16px 14px 14px;border:0;border-radius:14px;color:#2a1600;background:linear-gradient(180deg,#ffe78f,#ffc23a 55%,#f39b1f);box-shadow:0 6px 0 #a2560c,0 0 0 3px var(--edge),0 12px 26px rgba(255,180,40,.25);animation:pulse 2.4s ease-in-out infinite}
.cta small{display:block;font-family:var(--body);font-weight:700;font-size:13px;color:#6a3d00;margin-top:4px}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a2560c,0 0 0 3px var(--edge)}
.subcmds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:linear-gradient(180deg,var(--win2),var(--win));border:3px solid var(--frame);border-radius:12px;box-shadow:0 0 0 3px var(--edge);padding:10px 12px;min-width:0}
.subbtn b{font-family:var(--pix);font-weight:400;font-size:18px}
.subbtn span{font-size:12px;color:var(--muted)}
.subbtn[disabled]{opacity:.45;cursor:not-allowed}
.map{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 2px;position:relative}
.node+.node::before{content:"";position:absolute;left:31px;top:-12px;height:24px;border-left:3px dotted rgba(169,177,221,.5)}
.ico{width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 -14px 22px -10px var(--sc),0 0 0 2px rgba(255,255,255,.08)}
.ico canvas{animation:bob 2s ease-in-out infinite}
.node .t{min-width:0}
.node .t b{display:block;font-family:var(--pix);font-weight:400;font-size:19px;color:var(--sc);line-height:1.3}
.node .t span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.go{font-family:var(--pix);font-size:13px;background:transparent;border:2px solid var(--sc);color:var(--sc);border-radius:999px;padding:4px 10px;white-space:nowrap}
.go:hover{background:var(--sc);color:var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;background:rgba(255,92,122,.15);color:#ffb3c1;border:1px solid rgba(255,92,122,.4)}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;font-size:14px;align-items:baseline}
.rec span:nth-child(4n+2){color:var(--muted)}
.empty{font-size:14px;color:var(--muted);margin:0}
.howto{font-size:13px;color:var(--muted);margin:0}
.toprow{display:flex;justify-content:flex-end}
.snd{font-family:var(--pix);font-size:13px;background:rgba(255,255,255,.06);border:2px solid rgba(238,241,255,.35);border-radius:999px;padding:3px 12px}

/* ---------- battle ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px}
.hud .time{font-family:var(--pix);font-size:24px;line-height:1}
.hud .time small{font-size:11px;color:var(--muted);display:block;letter-spacing:.1em}
.hud .prog{font-family:var(--pix);font-size:15px;color:var(--muted);text-align:center}
.hud .score{font-family:var(--pix);font-size:18px;text-align:right;color:var(--gold);line-height:1}
.hud .score small{font-size:11px;color:var(--muted);display:block;letter-spacing:.1em}
.hudbtns{display:flex;justify-content:space-between;gap:8px}
.mini{font-family:var(--pix);font-size:12px;background:transparent;border:2px solid rgba(238,241,255,.3);border-radius:999px;padding:2px 10px;color:var(--muted)}
.arena{position:relative;height:210px;border-radius:14px;overflow:hidden;border:3px solid var(--frame);box-shadow:0 0 0 3px var(--edge);background:linear-gradient(180deg,#0c1342 0%,#16205e 70%,#1b2670 100%)}
.arena::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px),linear-gradient(180deg,transparent,rgba(0,0,0,.35));transform:perspective(220px) rotateX(55deg);transform-origin:bottom}
.floor{position:absolute;left:22%;right:22%;bottom:22px;height:28px;border-radius:50%;background:var(--sc);opacity:.38;filter:blur(10px)}
.plate{position:absolute;top:10px;left:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:4px}
.plate .nm{font-family:var(--pix);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.plate .nm span:last-child{color:var(--muted);font-size:13px}
.hp{height:12px;border:2px solid var(--frame);border-radius:6px;background:#060918;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5c7a,#ffb547 50%,#43e6a2);background-size:200% 100%;transition:width .35s}
.monwrap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2}
.mon{display:block;animation:bob 1.6s ease-in-out infinite}
.mon.appear{animation:appear .55s cubic-bezier(.2,1.4,.4,1)}
.mon.hit{animation:hitflash .4s}
.mon.atk{animation:lunge .45s}
.mon.down{animation:down .9s forwards}
.mon.flee{animation:flee .9s forwards}
.combo{position:absolute;right:12px;bottom:12px;z-index:3;font-family:var(--pix);color:var(--gold);font-size:22px;text-shadow:2px 2px 0 var(--edge);opacity:0}
.combo.show{opacity:1;animation:pop .35s}
.dmg{position:absolute;left:50%;top:40%;z-index:4;font-family:var(--pix);font-size:28px;color:#fff;text-shadow:2px 2px 0 var(--edge),0 0 12px var(--gold);pointer-events:none;animation:rise .9s forwards}
.dmg.bad{color:var(--miss);text-shadow:2px 2px 0 var(--edge)}
.bit{position:absolute;left:50%;top:55%;width:8px;height:8px;z-index:3;pointer-events:none;animation:fly .7s ease-out forwards}
.msg{min-height:140px;display:flex;flex-direction:column;gap:8px}
.msg .tag{font-family:var(--pix);font-size:14px;color:var(--sc);letter-spacing:.04em}
.msg .stmt{font-size:19px;font-weight:500;line-height:1.75;margin:0}
.msg .cont{font-family:var(--pix);color:var(--gold);align-self:flex-end;animation:blink 1s steps(2) infinite}
.msg .say{font-family:var(--pix);font-size:20px;line-height:1.6;margin:0}
.stamp{display:flex;align-items:center;gap:10px;font-family:var(--pix);font-size:26px;line-height:1.2}
.stamp.ok{color:var(--hit)}
.stamp.ng{color:var(--miss)}
.ans{font-size:14px;color:var(--muted)}
.ans b{color:var(--ink)}
.exp{font-size:16px;line-height:1.7;margin:0}
.aik{align-self:flex-start;font-family:var(--pix);font-size:14px;background:rgba(255,208,77,.14);color:var(--gold);border:1px solid rgba(255,208,77,.45);border-radius:6px;padding:2px 10px}
.next{align-self:stretch;font-family:var(--pix);font-size:18px;background:var(--frame);color:var(--edge);border:0;border-radius:10px;padding:10px;box-shadow:0 4px 0 #8b93c4}
.autobar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.autobar i{display:block;height:100%;background:var(--hit);animation:fill 1.1s linear forwards}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oxbtn{height:96px;border-radius:18px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.4),0 0 0 3px var(--edge);transition:transform .06s}
.oxbtn.maru{background:linear-gradient(180deg,#ff917f,#ff5a4f)}
.oxbtn.batsu{background:linear-gradient(180deg,#76a9ff,#3d70ec)}
.oxbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.4),0 0 0 3px var(--edge)}
.oxbtn[disabled]{filter:saturate(.35) brightness(.7);cursor:default}
.sym{position:relative;width:52px;height:52px}
.maru .sym{border:10px solid #fff;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.batsu .sym::before,.batsu .sym::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:11px;background:#fff;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translate(-50%,-50%) rotate(45deg)}
.batsu .sym::after{transform:translate(-50%,-50%) rotate(-45deg)}
.oxbtn .lbl{font-size:13px;font-weight:700;color:#fff;letter-spacing:.06em}
.keys{font-size:12px;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.keys{display:none}}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:var(--miss);opacity:0}
.flash.on{animation:flash .45s}
.shake{animation:shake .42s}

/* ---------- result ---------- */
.rank{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:22px}
.rank .lbl{font-family:var(--pix);font-size:14px;letter-spacing:.3em;color:var(--muted)}
.rank .name{font-family:var(--pix);font-size:clamp(40px,12vw,58px);line-height:1.15;color:var(--gold);text-shadow:3px 3px 0 #b4500f,6px 6px 0 var(--edge);animation:appear .7s cubic-bezier(.2,1.4,.4,1)}
.stars{font-size:30px;letter-spacing:.12em;color:#4a5288}
.stars .on{color:var(--gold);text-shadow:0 0 12px rgba(255,208,77,.6)}
.badge{font-family:var(--pix);font-size:15px;color:var(--edge);background:var(--hit);border-radius:999px;padding:2px 12px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}
.cell .k{font-size:12px;color:var(--muted)}
.cell .v{font-family:var(--pix);font-size:24px;line-height:1.25}
.cell .v small{font-size:13px;color:var(--muted);margin-left:4px}
.misses{display:flex;flex-direction:column;gap:10px}
.mi{border-left:4px solid var(--miss);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.mi .w{font-family:var(--pix);font-size:13px;color:var(--muted)}
.mi .s{font-size:15px;line-height:1.6}
.mi .a{font-size:14px;color:var(--hit)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.btn2{font-family:var(--pix);font-size:17px;border-radius:12px;padding:12px 10px;border:3px solid var(--frame);background:linear-gradient(180deg,var(--win2),var(--win));box-shadow:0 0 0 3px var(--edge)}

@keyframes float{50%{transform:translateY(-4px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{box-shadow:0 6px 0 #a2560c,0 0 0 3px var(--edge),0 12px 36px rgba(255,190,60,.6)}}
@keyframes appear{0%{transform:translateY(-40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes hitflash{0%{filter:brightness(4) saturate(0);transform:translateX(0)}25%{transform:translateX(-8px)}50%{filter:brightness(2);transform:translateX(8px)}100%{filter:none;transform:none}}
@keyframes lunge{0%{transform:none}40%{transform:translateY(10px) scale(1.18)}100%{transform:none}}
@keyframes down{0%{filter:brightness(3);opacity:1}30%{opacity:.2}45%{opacity:1}60%{opacity:.2}100%{transform:translateY(16px) scale(.4);opacity:0}}
@keyframes flee{0%{transform:none;opacity:1}100%{transform:translateX(160px) rotate(12deg);opacity:0}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
@keyframes fly{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>
<div class="wrap" id="app"></div>

<script>
/* ===================== data ===================== */
const EXAM = new Date(2026, 9, 18);
const STAGES = [
  {id:1, name:"権利の城", sub:"権利関係", boss:"ジュリス・ナイト", spr:"knight", c:"--s1"},
  {id:2, name:"法令の森", sub:"法令上の制限", boss:"ゾーニング・トレント", spr:"tree", c:"--s2"},
  {id:3, name:"税の関所", sub:"税・価格", boss:"ゼイキン・ミミック", spr:"mimic", c:"--s3"},
  {id:4, name:"業法の街", sub:"宅建業法", boss:"ギョウホウ・ドラゴン", spr:"dragon", c:"--s4"},
  {id:5, name:"知恵の塔", sub:"その他の知識", boss:"おとぼけスライム", spr:"slime", c:"--s5"},
];
const REVIVE = {name:"復活の泉", sub:"まちがえた武器を取りもどせ", boss:"復活の泉", spr:"crystal", c:"--s6"};
// 武器ごとの○✕文: [文, 正しいなら1・誤りなら0, ひとこと解説]
const D = [
{st:1,n:"意思表示",k:"2人でウソは無効、被害者は取消し",s:[
 ["冗談で「家をあげる」と言った約束は、相手が本気にしていれば、原則として有効である。",1,"冗談（心裡留保）は原則有効。相手が冗談だと知っていた・気づけた時だけ無効。"],
 ["相手と口裏を合わせたウソの売買契約は、原則として有効である。",0,"口裏合わせ（虚偽表示）は無効。2人とも本気ではないから。"],
 ["だまされて結んだ契約は、最初から無効である。",0,"詐欺は「取消し」。取り消すまでは有効。"],
 ["脅されて結んだ契約は、取り消すことができる。",1,"強迫は取消しできる。被害者は取消し。"]]},
{st:1,n:"代理",k:"",s:[
 ["代理権のない人が勝手に結んだ契約でも、本人が追認すれば有効になる。",1,"無権代理も、本人が追認すれば有効。"],
 ["同じ人が売主と買主の両方の代理人になることは、原則として自由にできる。",0,"双方代理は原則ダメ。ずるができるから。"],
 ["代理人が本人のためにすることを示して結んだ契約の効果は、代理人自身に生じる。",0,"効果は本人に生じる。"]]},
{st:1,n:"共有",k:"1・半・全",s:[
 ["共有者の1人は、他の共有者の同意がなくても、自分の持分を売ることができる。",1,"自分の持分は自由に売れる。"],
 ["共有物の修繕（保存行為）は、共有者全員の同意がなければできない。",0,"保存（修繕）は1人でできる。"],
 ["共有物全体を売るには、共有者全員の同意が必要である。",1,"売却などの変更は全員の同意。"],
 ["共有者の1人が無断で共有物全体を売っても、他の共有者の持分は買主に移らない。",1,"売れるのは自分の持分だけ。"],
 ["共有物の管理に関することは、原則として持分の価格の過半数で決める。",1,"管理（ふつうの賃貸など）は過半数。"]]},
{st:1,n:"相続",k:"3つから選ぶのに3か月",s:[
 ["相続人は、プラスの財産だけを選んで相続することができる。",0,"プラスだけは選べない。全部相続か、放棄か。"],
 ["相続放棄は、相続が始まったことを知った時から3か月以内に、家庭裁判所に申述する。",1,"期限は3か月。"],
 ["3か月以内に何も手続きをしなければ、相続を放棄したものとみなされる。",0,"何もしなければ、全部を相続したもの（単純承認）とみなされる。"]]},
{st:1,n:"債権と物権",k:"",s:[
 ["物権は、誰に対しても主張できる権利である。",1,"物権は誰にでも主張できる強い権利。"],
 ["債権は、契約の相手以外の人に対しても主張できる。",0,"債権は相手にだけ主張できる。"]]},
{st:1,n:"混同",k:"同じ人になるから「同」",s:[
 ["借主が貸主を1人で相続すると、混同によってその債権は消える。",1,"貸す人と借りる人が同じ人になると、債権は消える。"],
 ["混同は、連帯債務者の1人について生じても、他の連帯債務者には効力が及ばない。",0,"混同は全員に効力が及ぶ（弁済・相殺・混同・更改）。"]]},
{st:1,n:"時効",k:"10年は満点の人だけ",s:[
 ["自分の物だと信じ、落ち度もなく他人の土地を使い続けた人は、10年で時効取得できる。",1,"善意無過失なら10年。"],
 ["自分の物だと信じていたが不注意だった人も、10年で時効取得できる。",0,"不注意（有過失）なら20年。"],
 ["貸したお金を返してもらう権利は、行使できると知った時から5年で時効により消える。",1,"債権は、知った時から5年。"],
 ["貸したお金を返してもらう権利の消滅時効は、行使できる時から20年である。",0,"行使できる時から10年。"]]},
{st:1,n:"登記（物権変動）",k:"時効が先なら登記は急げ",s:[

function sprite(name, scale){
  const S = SPR[name], pal = Object.assign({"#":"#070a1c",k:"#0b0d1c",w:"#ffffff"}, S.pal);
  const c = document.createElement("canvas");
  c.width = 16*scale; c.height = 16*scale; c.setAttribute("aria-hidden","true");
  const g = c.getContext("2d");
  S.rows.forEach((row,y)=>{ for (let x=0;x<16;x++){ const ch=row[x]||"."; if (ch===".") continue; g.fillStyle=pal[ch]||"#fff"; g.fillRect(x*scale,y*scale,scale,scale); } });
  return c;
}

/* ===================== sky ===================== */
(function(){
  const c = document.getElementById("sky"), g = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w=0,h=0,stars=[],raf=0;
  function size(){
    const d = Math.min(window.devicePixelRatio||1, 2);
    w = c.width = Math.floor(innerWidth*d); h = c.height = Math.floor(innerHeight*d);
    c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px";
    stars = Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.round((Math.random()*2+1)*d),p:Math.random()*6.28,v:.4+Math.random()*1.4}));
  }
  function draw(t){
    g.clearRect(0,0,w,h);
    for (const s of stars){ const a = reduce ? .55 : .25+.75*Math.abs(Math.sin(s.p+t/1000*s.v)); g.fillStyle = "rgba(214,224,255,"+a.toFixed(2)+")"; g.fillRect(s.x,s.y,s.s,s.s); }
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  size(); draw(0);
  addEventListener("resize", ()=>{ size(); if (reduce) draw(0); });
  document.addEventListener("visibilitychange", ()=>{ cancelAnimationFrame(raf); if (!document.hidden && !reduce) raf = requestAnimationFrame(draw); });
})();

let AC = null;
let soundOn = (()=>{ try{ return localStorage.getItem("q53_sound") !== "off"; }catch(e){ return true; } })();
function setSound(v){ soundOn = v; try{ localStorage.setItem("q53_sound", v?"on":"off"); }catch(e){} }
function tone(seq){
  if (!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime;
    seq.forEach(([f,d,st,type,vol])=>{
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type||"square"; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t0+st);
      gn.gain.exponentialRampToValueAtTime(vol||0.06, t0+st+0.01);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0+st+d);
      o.connect(gn); gn.connect(AC.destination); o.start(t0+st); o.stop(t0+st+d+0.03);
    });
  }catch(e){}
}

const LS_KEY = "q53_state_v1";

function lsLoad(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }

async function initStore(){
  const ls = lsLoad(); if (ls && Array.isArray(ls.runs)) state = {runs: ls.runs};
  render();
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    if (snap.exists){ const d = snap.data(); if (d && Array.isArray(d.runs) && d.runs.length >= state.runs.length) state = {runs: d.runs.slice()}; }
    store = { async save(o){ try{ await ref.set(o); }catch(e){} } };
    if (view === "home") render();
  }catch(e){}
}
async function persist(){
  const o = {runs: state.runs.slice(-60), updatedAt: new Date().toISOString()};
  lsSave(o);
  if (store) await store.save(o);
}

const fmt = ms=>{ const t=Math.floor(ms/1000); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
const comma = n=>n.toLocaleString("ja-JP");
const dayKey = d=>{ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const stageOf = id=>STAGES.find(s=>s.id===id);
const shuffle = a=>{ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fullRuns = ()=>state.runs.filter(r=>r.mode==="all");
const bestTime = ()=>{ const f=fullRuns(); return f.length ? Math.min(...f.map(r=>r.ms)) : null; };
const bestScore = ()=>{ const f=fullRuns().filter(r=>typeof r.score==="number"); return f.length ? Math.max(...f.map(r=>r.score)) : null; };
const bestFirst = ()=>{ const f=fullRuns(); return f.length ? Math.max(...f.map(r=>r.first)) : null; };
function streak(){
  const days = new Set(state.runs.map(r=>dayKey(r.at)));
  let n=0; const d=new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while (days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((EXAM-t)/86400000)); }
function weakW(){
  const cnt={};
  state.runs.slice(-5).forEach(r=>(r.missW||r.misses||[]).forEach(id=>{ cnt[id]=(cnt[id]||0)+1; }));
  return Object.keys(cnt).map(Number).filter(id=>W[id-1]).sort((a,b)=>cnt[b]-cnt[a]);
}
function lastMissKeys(){ const r=state.runs[state.runs.length-1]; return r && Array.isArray(r.missK) ? r.missK : []; }

    <button class="cta" id="go-all">ぼうけんに出る<small>5つのステージ・53問の○✕タイムアタック</small></button>
    <div class="subcmds">
      <button class="subbtn" id="go-weak" ${lm.length?"":"disabled"}><b>特訓</b><span>${lm.length?`前回まちがえた ${lm.length}問`:"まちがいはまだ無し"}</span></button>
      <button class="subbtn" id="go-mix"><b>ランダム20</b><span>全○✕からランダムに20問</span></button>
    </div>
    <section class="win" aria-label="ワールドマップ">
      <span class="win-title">ワールドマップ</span>
      <div class="map">
        ${STAGES.map(s=>{ const n=W.filter(w=>w.st===s.id).reduce((a,w)=>a+w.s.length,0); return `
          <div class="node" style="--sc:var(${s.c})">
            <div class="ico" data-spr="${s.spr}"></div>
            <div class="t"><b>${s.name}</b><span>${s.sub}</span><span>ボス：${s.boss}</span></div>
            <button class="go" data-stage="${s.id}" aria-label="${s.name}の全○✕${n}問に挑む">全${n}問 ▶</button>
          </div>`; }).join("")}
      </div>
    </section>
    <section class="win" aria-label="苦手な武器">
      <span class="win-title">さいきんの強敵</span>
      ${weak.length?`<div class="chips">${weak.map(w=>`<span class="chip">${esc(w.n)}</span>`).join("")}</div>`:`<p class="empty">冒険を終えると、まちがえた武器がここに出ます。</p>`}
    </section>
    <section class="win" aria-label="冒険の記録">
      <span class="win-title">冒険の記録</span>
      ${hist.length?`<div class="rec num">${hist.map(r=>`<span>${dayKey(r.at).slice(5).replace("-","/")}</span><span>${r.mode==="all"?"本編":r.mode==="weak"?"特訓":r.mode==="mix"?"ランダム":esc(stageOf(r.stage)?.name||"")}</span><span>${r.first}/${r.total}</span><span>${fmt(r.ms)}</span>`).join("")}</div>`:`<p class="empty">まだ記録はありません。今日が冒険の1日目です。</p>`}
    </section>
    <p class="howto">遊び方：文を読んで、正しければ○、まちがいなら✕。正解でモンスターにダメージ、連続正解でコンボ。まちがえた文は最後の「復活の泉」でもう一度出ます。キーボードは ○＝O か ←、✕＝X か →、次へ＝Enter。</p>
  `;
  document.querySelectorAll("[data-spr]").forEach(el=>el.appendChild(sprite(el.dataset.spr, 3)));
  $("#snd").onclick = ()=>{ setSound(!soundOn); $("#snd").textContent = soundOn?"音 ON":"音 OFF"; };
  $("#go-all").onclick = ()=>start("all");
  $("#go-weak").onclick = ()=>{ if (lm.length) start("weak"); };
  $("#go-mix").onclick = ()=>start("mix");
  document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>start("stage", Number(b.dataset.stage)));
}

/* ---------- build a run ---------- */
function buildItems(mode, stage){
  const byStage = (items)=>{ const out=[]; STAGES.forEach(s=>out.push(...shuffle(items.filter(i=>W[i.w-1].st===s.id)))); return out; };
  if (mode==="all") return byStage(W.map(w=>({w:w.id, v:Math.floor(Math.random()*w.s.length)})));
  if (mode==="stage"){ const items=[]; W.filter(w=>w.st===stage).forEach(w=>w.s.forEach((_,v)=>items.push({w:w.id,v}))); return shuffle(items); }
  if (mode==="weak") return byStage(lastMissKeys().map(k=>{ const [w,v]=k.split(":").map(Number); return {w,v}; }).filter(i=>W[i.w-1] && W[i.w-1].s[i.v]));
  if (mode==="mix"){ const all=[]; W.forEach(w=>w.s.forEach((_,v)=>all.push({w:w.id,v}))); return byStage(shuffle(all).slice(0,20)); }
  return [];
}

function start(mode, stage){
  const items = buildItems(mode, stage);
  if (!items.length) return;
  clearSeq(); clearInterval(clock);
  run = {mode, stage:stage||null, items, idx:0, total:items.length, first:0, score:0, combo:0, maxCombo:0,
         missK:[], missW:[], revive:[], phase:"battle", rq:[], rnext:[], ridx:0, answered:true,
         t0:performance.now(), qStart:0, curStage:null, hp:0, hpMax:0};
  view = "battle";
  SFX.start();
  renderBattle();
  clock = setInterval(()=>{ const t=$("#time"); if (t) t.textContent = fmt(performance.now()-run.t0); }, 200);
  enterStage(items[0] ? W[items[0].w-1].st : 1);
}

function renderBattle(){
  $("#app").innerHTML = `
    <div class="hudbtns"><button class="mini" id="quit">にげる</button><button class="mini" id="snd2">${soundOn?"音 ON":"音 OFF"}</button></div>
    <div class="win hud">
      <div class="time num"><small>TIME</small><span id="time">0:00</span></div>
      <div class="prog num" id="prog"></div>
      <div class="score num"><small>SCORE</small><span id="score">0</span></div>
    </div>
    <div class="arena" id="arena">
      <div class="floor"></div>
      <div class="plate"><div class="nm"><span id="mname"></span><span id="mhp"></span></div><div class="hp"><i id="hpbar"></i></div></div>
      <div class="monwrap" id="monwrap"></div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="win msg" id="msg"></div>
    <div class="ox" id="ox">
      <button class="oxbtn maru" id="bo" aria-label="○ 正しい"><span class="sym"></span><span class="lbl">正しい</span></button>
      <button class="oxbtn batsu" id="bx" aria-label="✕ まちがい"><span class="sym"></span><span class="lbl">まちがい</span></button>
    </div>
    <p class="keys">○＝O / ←　✕＝X / →　次へ＝Enter</p>
  `;
  $("#quit").onclick = ()=>{ clearSeq(); clearInterval(clock); run=null; view="home"; render(); };
  $("#snd2").onclick = ()=>{ setSound(!soundOn); $("#snd2").textContent = soundOn?"音 ON":"音 OFF"; };
  $("#bo").onclick = ()=>answer(true);
  $("#bx").onclick = ()=>answer(false);
  setButtons(false);
}

function setButtons(on){ const a=$("#bo"), b=$("#bx"); if (a){ a.disabled=!on; b.disabled=!on; } }
function curItem(){ return run.phase==="battle" ? run.items[run.idx] : run.rq[run.ridx]; }
function setArenaColor(cvar){ const ar=$("#arena"), m=$("#msg"); ar.style.setProperty("--sc", `var(${cvar})`); m.style.setProperty("--sc", `var(${cvar})`); }
function updateHud(){
  $("#score").textContent = comma(run.score);
  $("#prog").textContent = run.phase==="battle" ? `${run.idx+1} / ${run.total}` : `のこり ${run.hp}`;
  $("#mhp").textContent = `HP ${run.hp}/${run.hpMax}`;
  $("#hpbar").style.width = (run.hpMax ? run.hp/run.hpMax*100 : 0) + "%";
}
function showMonster(sprName, cls){
  const mw = $("#monwrap"); mw.innerHTML = "";
  const c = sprite(sprName, 7); c.className = "mon " + (cls||""); mw.appendChild(c);
  if (cls) c.addEventListener("animationend", ()=>{ if (c.classList.contains("appear")) c.className="mon"; }, {once:true});
  return c;
}
function animMon(cls){
  const c = $("#monwrap canvas"); if (!c) return;
  c.className = "mon"; void c.offsetWidth; c.className = "mon " + cls;
  if (cls==="hit" || cls==="atk") c.addEventListener("animationend", ()=>{ c.className="mon"; }, {once:true});
}
function popText(txt, bad){
  const ar=$("#arena"); const d=document.createElement("div"); d.className="dmg"+(bad?" bad":""); d.textContent=txt; ar.appendChild(d);
  d.addEventListener("animationend", ()=>d.remove(), {once:true});
}
function burst(n, color){
  const ar=$("#arena");
  for (let i=0;i<n;i++){
    const b=document.createElement("i"); b.className="bit";
    const ang=Math.random()*Math.PI*2, dist=50+Math.random()*80;
    b.style.setProperty("--dx", Math.round(Math.cos(ang)*dist)+"px"); b.style.setProperty("--dy", Math.round(Math.sin(ang)*dist)+"px");
    b.style.background = color || "var(--gold)";
    ar.appendChild(b); b.addEventListener("animationend", ()=>b.remove(), {once:true});
  }
}
function showCombo(){
  const c=$("#combo");
  if (run.combo>=2){ c.textContent = run.combo+" COMBO"; c.className="combo"; void c.offsetWidth; c.className="combo show"; }
  else c.className="combo";
}
function say(html, cont){
  $("#msg").innerHTML = `<p class="say">${html}</p>${cont?'<span class="cont">▼</span>':""}`;
}

/* ---------- stage flow ---------- */
function enterStage(stId){
  const s = stageOf(stId);
  run.curStage = stId;
  run.hpMax = run.hp = run.items.filter(i=>W[i.w-1].st===stId).length;
  setArenaColor(s.c);
  $("#mname").textContent = s.boss;
  updateHud();
  showMonster(s.spr, "appear");
  say(`${esc(s.name)}<br><span style="color:var(--sc)">${esc(s.boss)}</span> が あらわれた！`, true);
  setButtons(false);
  later(showQuestion, 1000);
}

function showQuestion(){
  const it = curItem(), w = W[it.w-1], s = stmt(it);
  updateHud();
  $("#msg").innerHTML = `<span class="tag">${run.phase==="revive"?"復活の泉　":""}【${esc(w.n)}】</span><p class="stmt">${esc(s.t)}</p>`;
  run.answered = false; run.qStart = performance.now();
  setButtons(true);
}

function answer(val){
  if (!run || run.answered) return;
  run.answered = true; setButtons(false);
  const it = curItem(), w = W[it.w-1], s = stmt(it);
  const ok = (val === s.v);
  const secs = (performance.now()-run.qStart)/1000;
  if (run.phase==="battle"){
    if (ok){
      run.first++; run.combo++; run.maxCombo=Math.max(run.maxCombo, run.combo);
      const pts = 100 + 10*Math.min(run.combo,20) + (secs<3?100:secs<5?50:0);
      run.score += pts; run.hp = Math.max(0, run.hp-1);
      animMon("hit"); popText("+"+pts); burst(8); SFX.hit();
      if (run.combo>0 && run.combo%5===0) later(SFX.combo, 120);
    } else {
      run.combo = 0;
      run.missK.push(it.w+":"+it.v); if (!run.missW.includes(it.w)) run.missW.push(it.w);
      run.revive.push(it);
      animMon("atk"); popText("MISS", true); hurt(); SFX.miss();
    }
  } else {
    if (ok){ run.hp = Math.max(0, run.hp-1); animMon("hit"); popText("とりもどした！"); burst(10, "var(--s6)"); SFX.hit(); }
    else { run.rnext.push(it); animMon("atk"); popText("MISS", true); hurt(); SFX.miss(); }
  }
  showCombo(); updateHud();
  feedback(ok, s, w);
}

function hurt(){
  const f=$("#flash"); f.className="flash"; void f.offsetWidth; f.className="flash on";
  const app=$("#app"); app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
  try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
}

function feedback(ok, s, w){
  const truth = s.v ? "○（正しい）" : "✕（まちがい）";
  $("#msg").innerHTML = `
    <div class="stamp ${ok?"ok":"ng"}">${ok?"せいかい！":"ざんねん…"}</div>
    <div class="ans">答え <b>${truth}</b>　【${esc(w.n)}】</div>
    <p class="exp">${esc(s.e)}</p>
    ${w.k?`<span class="aik">合言葉　${esc(w.k)}</span>`:""}
    ${ok?'<div class="autobar"><i></i></div>':'<button class="next" id="next">つぎへ ▶</button>'}
  `;
  if (ok){ autoT = setTimeout(next, 1100); $("#msg").onclick = ()=>next(); }
  else { $("#msg").onclick = null; const n=$("#next"); n.onclick = next; n.focus(); }
}

function next(){
  if (!run || !run.answered) return;
  clearTimeout(autoT); autoT=null; $("#msg").onclick = null;
  if (run.phase==="battle"){
    run.idx++;
    if (run.idx >= run.items.length){ return endStage(()=>{ if (run.revive.length) enterRevive(); else finish(); }); }
    const nextSt = W[run.items[run.idx].w-1].st;
    if (nextSt !== run.curStage) return endStage(()=>enterStage(nextSt));
    showQuestion();
  } else {
    run.ridx++;
    if (run.ridx >= run.rq.length){
      if (run.rnext.length){ run.rq = shuffle(run.rnext); run.rnext=[]; run.ridx=0; }
      else return endRevive();
    }
    showQuestion();
  }
}

function endStage(cb){
  const s = stageOf(run.curStage);
  run.answered = true; setButtons(false);
  if (run.hp===0){
    animMon("down"); burst(24); SFX.clear();
    say(`<span style="color:var(--sc)">${esc(s.boss)}</span> を たおした！`, false);
  } else {
    animMon("flee"); SFX.flee();
    say(`<span style="color:var(--sc)">${esc(s.boss)}</span> は にげだした！<br><span style="font-size:15px;color:var(--muted)">のこりHP ${run.hp}。復活の泉で とりもどそう。</span>`, false);
  }
  later(cb, 1400);
}

function enterRevive(){
  run.phase = "revive";
  run.rq = shuffle(run.revive.slice()); run.rnext = []; run.ridx = 0;
  run.hpMax = run.hp = run.rq.length;
  setArenaColor(REVIVE.c);
  $("#mname").textContent = REVIVE.name;
  updateHud();
  showMonster(REVIVE.spr, "appear");
  say(`<span style="color:var(--sc)">復活の泉</span> が わいている…<br><span style="font-size:15px;color:var(--muted)">まちがえた ${run.rq.length}問を とりもどそう。</span>`, true);
  later(showQuestion, 1300);
}

function endRevive(){
  run.answered = true; setButtons(false);
  animMon("down"); burst(28, "var(--s6)"); SFX.clear();
  say(`すべての武器を とりもどした！`, false);
  later(finish, 1300);
}

/* ---------- finish ---------- */
function finish(){
  clearInterval(clock); clearSeq();
  const ms = Math.round(performance.now()-run.t0);
  const prevTime = bestTime(), prevScore = bestScore();
  const rec = {at:new Date().toISOString(), mode:run.mode, stage:run.stage, total:run.total, first:run.first, ms, score:run.score, maxCombo:run.maxCombo, missK:run.missK, missW:run.missW};
  state.runs.push(rec);
  run.result = Object.assign({}, rec, {
    newTime: run.mode==="all" && (prevTime==null || ms<prevTime),
    newScore: run.mode==="all" && (prevScore==null || run.score>prevScore)
  });
  view = "result";
  SFX.fanfare();
  renderResult();
  persist();
}

function renderResult(){
  const r = run.result;
  const [title, stars] = rankFor(r.first, r.total);
  const misses = r.missK.map(k=>{ const [w,v]=k.split(":").map(Number); return {w:W[w-1], s:W[w-1].s[v]}; });
  $("#app").innerHTML = `
    <section class="win rank" aria-label="結果">
      <span class="lbl">RANK</span>
      <span class="name">${title}</span>
      <span class="stars" aria-label="星${stars}つ">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?"on":""}">★</span>`).join("")}</span>
      ${r.newTime?'<span class="badge">ベストタイム更新！</span>':""}
      ${r.newScore&&!r.newTime?'<span class="badge">最高スコア更新！</span>':""}
    </section>
    <section class="win">
      <span class="win-title">けっか</span>
      <div class="grid4 num">
        <div class="cell"><div class="k">一発正解</div><div class="v">${r.first}<small>/ ${r.total}</small></div></div>
        <div class="cell"><div class="k">タイム</div><div class="v">${fmt(r.ms)}<small>${speedFor(r.ms, r.total)}</small></div></div>
        <div class="cell"><div class="k">スコア</div><div class="v" style="color:var(--gold)" id="sc">0</div></div>
        <div class="cell"><div class="k">最大コンボ</div><div class="v">${r.maxCombo}</div></div>
      </div>
    </section>
    ${misses.length?`<section class="win"><span class="win-title">取りもどした武器（明日の特訓に出ます）</span><div class="misses">${misses.map(m=>`
      <div class="mi"><span class="w">【${esc(m.w.n)}】</span><span class="s">${esc(m.s.t)}</span><span class="a">答え ${m.s.v?"○":"✕"}　${esc(m.s.e)}</span></div>`).join("")}</div></section>`
      :`<p class="empty" style="text-align:center">全問、一発正解。完璧です！</p>`}
    <div class="row">
      ${misses.length?'<button class="cta" id="again-weak" style="font-size:22px">まちがえた所を特訓</button>':""}
    </div>
    <div class="row">
      <button class="btn2" id="again">もう一度ぼうけん</button>
      <button class="btn2" id="home">ワールドマップへ</button>
    </div>
  `;
  const sc=$("#sc"), target=r.score, t0=performance.now();
  (function count(t){ const p=Math.min(1,(t-t0)/900); sc.textContent=comma(Math.round(target*p)); if (p<1) requestAnimationFrame(count); })(t0);
  const aw=$("#again-weak"); if (aw) aw.onclick = ()=>start("weak");
  $("#again").onclick = ()=>start(r.mode==="stage"?"stage":r.mode==="weak"?"all":r.mode, r.stage);
  $("#home").onclick = ()=>{ run=null; view="home"; render(); };
}

/* ---------- keys ---------- */
document.addEventListener("keydown", e=>{
  if (view!=="battle" || !run) return;
  const k = e.key.toLowerCase();
  if (!run.answered){
    if (k==="o" || k==="arrowleft" || k==="z"){ e.preventDefault(); answer(true); }
    else if (k==="x" || k==="arrowright"){ e.preventDefault(); answer(false); }
  } else if ((k==="enter" || k===" ") && $("#msg .stamp")){ e.preventDefault(); next(); }
});

initStore();
</script>
