<title>53武器クエスト</title>
<meta name="theme-color" content="#0b1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one-column night-dungeon RPG. Home = hero bar, doom countdown, one big "つづきから", world map. Battle = hearts/score HUD, arena, message window, ○✕ pads. Dark only, by choice (an arcade screen). */
:root{
  --night:#0b1030;
  --win:#0f163b;
  --win2:#18215a;
  --frame:#eef1ff;
  --edge:#04061a;
  --ink:#f3f5ff;
  --muted:#a9b1dd;
  --dim:#5d669a;
  --gold:#ffd04d;
  --gold2:#b4500f;
  --hit:#43e6a2;
  --miss:#ff5c7a;
  --rust:#d8894a;
  --fever:#ff6be6;
  --s1:#a684ff; --s2:#5fd68f; --s3:#ffb547; --s4:#5aa9ff; --s5:#ff86bd; --s6:#6fe7ff; --s7:#ff6a5a;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d2766 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pix{font-family:var(--pix);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.win{position:relative;background:linear-gradient(180deg,var(--win2),var(--win));border:3px solid var(--frame);border-radius:12px;box-shadow:0 0 0 3px var(--edge),0 12px 28px rgba(0,0,0,.45);padding:14px 16px}
.win-title{position:absolute;top:-13px;left:14px;font-family:var(--pix);font-size:13px;background:var(--win2);padding:0 8px;color:var(--gold);letter-spacing:.08em}
.mini{font-family:var(--pix);font-size:13px;background:rgba(255,255,255,.05);border:2px solid rgba(238,241,255,.3);border-radius:999px;padding:3px 12px;color:var(--muted)}
.mini.warn{border-color:var(--miss);color:var(--miss)}
.cta{display:block;width:100%;font-family:var(--pix);font-size:28px;line-height:1.2;padding:16px 14px 14px;border:0;border-radius:14px;color:#2a1600;background:linear-gradient(180deg,#ffe78f,#ffc23a 55%,#f39b1f);box-shadow:0 6px 0 #a2560c,0 0 0 3px var(--edge),0 12px 26px rgba(255,180,40,.25);animation:pulse 2.4s ease-in-out infinite}
.cta small{display:block;font-family:var(--body);font-weight:700;font-size:13px;color:#6a3d00;margin-top:4px}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a2560c,0 0 0 3px var(--edge)}
.btn2{font-family:var(--pix);font-size:17px;border-radius:12px;padding:12px 10px;border:3px solid var(--frame);background:linear-gradient(180deg,var(--win2),var(--win));box-shadow:0 0 0 3px var(--edge)}
.btn2:active{transform:translateY(2px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.empty{font-size:14px;color:var(--muted);margin:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-family:var(--pix);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.bar .r{margin-left:auto;font-family:var(--pix);font-size:13px;color:var(--muted)}

/* ---------- home ---------- */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.me{min-width:0}
.me .nm{font-family:var(--pix);font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .lv{color:var(--gold)}
.me .ttl{font-size:12px;color:var(--muted)}
.expbar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px;max-width:220px}
.expbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hit),#b8ffdf)}
.logo{text-align:center}
.kicker{font-family:var(--pix);color:var(--gold);letter-spacing:.28em;font-size:13px}
.logo h1{font-family:var(--pix);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1.08;margin:4px 0 0;color:#fff;text-shadow:3px 3px 0 #3a23a0,6px 6px 0 var(--edge);text-wrap:balance}
.logo h1 .n{color:var(--gold);font-size:1.22em;text-shadow:3px 3px 0 var(--gold2),6px 6px 0 var(--edge)}
.logo .float{display:inline-block;animation:float 3.2s ease-in-out infinite}
.logo.big h1{font-size:clamp(42px,13vw,64px)}
.doom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;border-color:#ffb3c1;background:linear-gradient(180deg,#3a0f2e,#1a0a26)}
.doom .ico{width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:rgba(255,59,107,.12)}
.doom small{display:block;font-size:12px;color:#ffb3c1;letter-spacing:.08em}
.doom b{display:block;font-family:var(--pix);font-weight:400;font-size:22px;line-height:1.3}
.doom b .n{font-size:36px;color:var(--miss);text-shadow:2px 2px 0 var(--edge)}
.doom .date{display:block;font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:0;background:linear-gradient(180deg,var(--win2),var(--win));border:3px solid var(--frame);border-radius:12px;box-shadow:0 0 0 3px var(--edge);padding:8px 6px;min-width:0}
.qbtn b{font-family:var(--pix);font-weight:400;font-size:17px;line-height:1.4}
.qbtn span{font-size:12px;color:var(--muted)}
.qbtn.rust{border-color:var(--rust)}
.qbtn.rust b{color:var(--rust)}
.qbtn[disabled]{opacity:.45;cursor:not-allowed}
.map{display:flex;flex-direction:column;gap:4px;padding-block:18px 10px}
.node{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 6px;position:relative;width:100%;text-align:left;background:transparent;border:0;border-radius:12px}
.node:hover{background:rgba(255,255,255,.04)}
.node+.node::before{content:"";position:absolute;left:33px;top:-10px;height:18px;border-left:3px dotted rgba(169,177,221,.45)}
.node .ico{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 -14px 22px -10px var(--sc),0 0 0 2px rgba(255,255,255,.08)}
.node .ico canvas{animation:bob 2s ease-in-out infinite}
.node .t{min-width:0;display:flex;flex-direction:column}
.node .t small{font-family:var(--pix);font-size:11px;color:var(--muted);letter-spacing:.12em}
.node .t b{font-family:var(--pix);font-weight:400;font-size:19px;color:var(--sc);line-height:1.25}
.node .t span{font-size:12px;color:var(--muted);line-height:1.5}
.node .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.node .st .best{font-family:var(--pix);font-size:12px;color:var(--muted)}
.node.clear .ico{box-shadow:inset 0 -14px 22px -10px var(--sc),0 0 0 2px var(--sc)}
.node.lock{opacity:.55;cursor:not-allowed}
.node.lock .ico canvas{animation:none;filter:grayscale(1) brightness(.5)}
.node.final .t b{font-size:21px}
.node.next .t b::after{content:" ◀";color:var(--gold);font-size:14px;animation:blink 1s steps(2) infinite}
.stars{letter-spacing:.06em;color:#3c4478;font-size:15px;line-height:1}
.stars .on{color:var(--gold);text-shadow:0 0 8px rgba(255,208,77,.55)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* ---------- armory ---------- */
.arm{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding-top:6px}
.wpn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:10px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);min-width:0}
.wpn .wn{font-size:12px;line-height:1.35;text-align:center;word-break:break-all;min-height:2.7em;display:flex;align-items:center}
.wpn.s0 .wn{color:var(--dim)}
.wpn.s3{border-color:var(--gold);box-shadow:0 0 12px rgba(255,208,77,.35)}
.wpn.rusty{border-color:var(--rust)}
.wpn .rtag{font-family:var(--pix);font-size:11px;color:var(--rust)}
.legend{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.wd-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.wd-head h3{font-family:var(--pix);font-weight:400;font-size:24px;margin:0;line-height:1.25}
.wd-head .sub{font-size:13px;color:var(--muted)}
.aik{align-self:flex-start;font-family:var(--pix);font-size:14px;background:rgba(255,208,77,.14);color:var(--gold);border:1px solid rgba(255,208,77,.45);border-radius:6px;padding:2px 10px}
.slist{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.si{border-left:4px solid var(--dim);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.si.ok{border-color:var(--hit)}
.si.gold{border-color:var(--gold)}
.si.rust{border-color:var(--rust)}
.si .tg{font-family:var(--pix);font-size:12px;color:var(--muted)}
.si.rust .tg{color:var(--rust)}
.si.gold .tg{color:var(--gold)}
.si .s{font-size:15px;line-height:1.6}
.si .a{font-size:14px;color:var(--hit)}

/* ---------- tale / story ---------- */
.tale{display:flex;flex-direction:column;gap:16px;min-height:calc(100% - 20px);padding-top:4px}
.tale-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--pix);font-size:13px}
.tale-art{display:grid;place-items:center;min-height:150px}
.tale-art canvas{animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(166,132,255,.35))}
.tale-box{cursor:pointer;min-height:168px;display:flex;flex-direction:column;gap:8px}
.txt{white-space:pre-line;font-family:var(--pix);font-size:19px;line-height:1.85;margin:0;min-height:5.5em}
.cont{font-family:var(--pix);color:var(--gold);align-self:flex-end;animation:blink 1s steps(2) infinite}
.nameform{display:flex;flex-direction:column;gap:10px}
.nameform label{font-size:13px;color:var(--muted)}
.field{font-family:var(--pix);font-size:22px;padding:10px 12px;border-radius:10px;border:3px solid var(--frame);background:var(--edge);color:var(--ink);width:100%}
.theend{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.theend .big{font-family:var(--pix);font-size:clamp(40px,12vw,60px);color:var(--gold);text-shadow:3px 3px 0 var(--gold2),6px 6px 0 var(--edge);line-height:1.1}
.story{display:flex;flex-direction:column;gap:14px;text-align:center;padding-top:10px}
.story .chap{font-family:var(--pix);color:var(--gold);letter-spacing:.3em;font-size:14px}
.story h2{font-family:var(--pix);font-weight:400;font-size:clamp(36px,11vw,52px);line-height:1.1;margin:0;color:var(--sc);text-shadow:3px 3px 0 var(--edge)}
.story .land{font-family:var(--pix);font-size:17px;line-height:1.8;margin:0;min-height:3.6em;white-space:pre-line}
.boss-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left}
.boss-card b{font-family:var(--pix);font-weight:400;font-size:18px;color:var(--sc)}
.boss-card p{margin:2px 0 0;font-size:15px;line-height:1.6}
.rule{font-size:14px;color:var(--muted);line-height:1.7;margin:0}
.rule b{color:var(--ink)}

/* ---------- battle ---------- */
.hudbtns{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hudbtns .mode{font-family:var(--pix);font-size:13px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 12px}
.hearts{display:flex;flex-wrap:wrap;gap:0 1px;font-family:var(--pix);font-size:17px;line-height:1.1;color:var(--miss);max-width:150px}
.hearts small{width:100%;font-size:11px;color:var(--muted);letter-spacing:.1em}
.hearts .off{color:#363c6b}
.hearts.pinch .on{display:inline-block;animation:beat .6s ease-in-out infinite}
.hearts.inf{color:var(--s6)}
.hud .prog{font-family:var(--pix);font-size:15px;color:var(--muted);text-align:center}
.hud .score{font-family:var(--pix);font-size:18px;text-align:right;color:var(--gold);line-height:1.1}
.hud .score small{font-size:11px;color:var(--muted);display:block;letter-spacing:.1em}
.arena{position:relative;height:208px;border-radius:14px;overflow:hidden;border:3px solid var(--frame);box-shadow:0 0 0 3px var(--edge);background:linear-gradient(180deg,#0c1342 0%,#16205e 70%,#1b2670 100%);transition:filter .6s}
.arena::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px),linear-gradient(180deg,transparent,rgba(0,0,0,.35));transform:perspective(220px) rotateX(55deg);transform-origin:bottom}
.arena.phase2{background:linear-gradient(180deg,#2a0614 0%,#4a0d22 70%,#5c1229 100%)}
.arena.fever{border-color:var(--fever);animation:feverglow .9s ease-in-out infinite}
.arena.dead{filter:grayscale(1) brightness(.55)}
.arena.quake{animation:shake .35s}
.floor{position:absolute;left:22%;right:22%;bottom:20px;height:28px;border-radius:50%;background:var(--sc);opacity:.38;filter:blur(10px)}
.plate{position:absolute;top:10px;left:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:4px}
.plate .nm{font-family:var(--pix);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.plate .nm span:last-child{color:var(--muted);font-size:13px}
.hp{height:12px;border:2px solid var(--frame);border-radius:6px;background:#060918;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5c7a,#ffb547 50%,#43e6a2);transition:width .35s}
.monwrap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2}
.mon{display:block;animation:bob 1.6s ease-in-out infinite}
.mon.appear{animation:appear .55s cubic-bezier(.2,1.4,.4,1)}
.mon.hit{animation:hitflash .4s}
.mon.atk{animation:lunge .45s}
.mon.down{animation:down .9s forwards}
.combo{position:absolute;right:12px;bottom:10px;z-index:3;font-family:var(--pix);color:var(--gold);font-size:22px;text-shadow:2px 2px 0 var(--edge);opacity:0}
.combo.show{opacity:1;animation:pop .35s}
.fevertag{position:absolute;left:12px;bottom:12px;z-index:3;font-family:var(--pix);font-size:15px;color:var(--fever);text-shadow:2px 2px 0 var(--edge);opacity:0}
.arena.fever .fevertag{opacity:1;animation:blink .5s steps(2) infinite}
.atime{position:absolute;left:12px;top:46px;z-index:3;font-family:var(--pix);font-size:12px;color:var(--muted)}
.bubble{position:absolute;top:46px;right:10px;max-width:62%;z-index:5;background:var(--frame);color:var(--edge);font-family:var(--pix);font-size:13px;line-height:1.5;padding:6px 10px;border-radius:10px;box-shadow:0 0 0 2px var(--edge);animation:pop .25s}
.bubble::after{content:"";position:absolute;left:18px;bottom:-7px;border:7px solid transparent;border-top-color:var(--frame);border-bottom:0}
.dmg{position:absolute;left:50%;top:40%;z-index:6;font-family:var(--pix);font-size:28px;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 var(--edge),0 0 12px var(--gold);pointer-events:none;animation:rise .9s forwards}
.dmg.bad{color:var(--miss);text-shadow:2px 2px 0 var(--edge)}
.dmg.crit{color:var(--gold);font-size:32px}
.bit{position:absolute;left:50%;top:55%;width:8px;height:8px;z-index:3;pointer-events:none;animation:fly .7s ease-out forwards}
.slash{position:absolute;left:50%;top:56%;width:190px;height:6px;margin-left:-95px;z-index:4;pointer-events:none;border-radius:6px;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 14px #fff;transform:rotate(-28deg) scaleX(0);animation:slash .3s ease-out both}
.slash.b{transform:rotate(28deg) scaleX(0);animation-name:slash2;animation-delay:.08s}
.slash.crit{height:9px;background:linear-gradient(90deg,transparent,var(--gold) 25%,#fff 50%,var(--gold) 75%,transparent);box-shadow:0 0 20px var(--gold)}
.msg{min-height:150px;display:flex;flex-direction:column;gap:8px}
.msg .tag{font-family:var(--pix);font-size:14px;color:var(--sc);letter-spacing:.04em}
.msg .stmt{font-size:19px;font-weight:500;line-height:1.75;margin:0}
.msg .say{font-family:var(--pix);font-size:20px;line-height:1.6;margin:0}
.critbar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:auto}
.critbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#fff3c4);transform-origin:left;animation:drain linear forwards}
.stamp{font-family:var(--pix);font-size:26px;line-height:1.2}
.stamp.ok{color:var(--hit)}
.stamp.crit{color:var(--gold)}
.stamp.ng{color:var(--miss)}
.ans{font-size:14px;color:var(--muted)}
.ans b{color:var(--ink)}
.exp{font-size:16px;line-height:1.7;margin:0}
.next{align-self:stretch;font-family:var(--pix);font-size:18px;background:var(--frame);color:var(--edge);border:0;border-radius:10px;padding:10px;box-shadow:0 4px 0 #8b93c4}
.autobar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.autobar i{display:block;height:100%;background:var(--hit);animation:fill .95s linear forwards}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oxbtn{height:96px;border-radius:18px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.4),0 0 0 3px var(--edge);transition:transform .06s;touch-action:manipulation}
.oxbtn.maru{background:linear-gradient(180deg,#ff917f,#ff5a4f)}
.oxbtn.batsu{background:linear-gradient(180deg,#76a9ff,#3d70ec)}
.oxbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.4),0 0 0 3px var(--edge)}
.oxbtn[disabled]{filter:saturate(.35) brightness(.7);cursor:default}
.sym{position:relative;width:52px;height:52px}
.maru .sym{border:10px solid #fff;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.batsu .sym::before,.batsu .sym::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:11px;background:#fff;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translate(-50%,-50%) rotate(45deg)}
.batsu .sym::after{transform:translate(-50%,-50%) rotate(-45deg)}
.oxbtn .lbl{font-size:13px;font-weight:700;color:#fff;letter-spacing:.06em}
.keys{font-size:12px;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.keys{display:none}}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:var(--miss);opacity:0}
.flash.on{animation:flash .45s}
.flash.white{background:#fff}
.shake{animation:shake .42s}

/* ---------- result ---------- */
.rank{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:22px}
.rank .lbl{font-family:var(--pix);font-size:14px;letter-spacing:.3em;color:var(--muted)}
.rank .name{font-family:var(--pix);font-size:clamp(36px,11vw,54px);line-height:1.15;color:var(--gold);text-shadow:3px 3px 0 var(--gold2),6px 6px 0 var(--edge);animation:appear .7s cubic-bezier(.2,1.4,.4,1)}
.rank.lose .name{color:var(--miss);text-shadow:3px 3px 0 #5a0f22,6px 6px 0 var(--edge)}
.rank .bigstars{font-size:34px;letter-spacing:.12em;color:#3c4478}
.rank .bigstars span{display:inline-block}
.rank .bigstars .on{color:var(--gold);text-shadow:0 0 14px rgba(255,208,77,.7);animation:pop .4s}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.badge{font-family:var(--pix);font-size:14px;color:var(--edge);background:var(--hit);border-radius:999px;padding:2px 12px}
.badge.gold{background:var(--gold)}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

(function(){
  const c = document.getElementById("sky"), g = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w=0,h=0,stars=[],raf=0;
  function size(){
    const d = Math.min(window.devicePixelRatio||1, 2);
    w = c.width = Math.floor(innerWidth*d); h = c.height = Math.floor(innerHeight*d);
    c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px";
    stars = Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.round((Math.random()*2+1)*d),p:Math.random()*6.28,v:.4+Math.random()*1.4}));
  }
  function draw(t){
    g.clearRect(0,0,w,h);
    for (const s of stars){ const a = reduce ? .55 : .25+.75*Math.abs(Math.sin(s.p+t/1000*s.v)); g.fillStyle = "rgba(214,224,255,"+a.toFixed(2)+")"; g.fillRect(s.x,s.y,s.s,s.s); }
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  size(); draw(0);
  addEventListener("resize", ()=>{ size(); if (reduce) draw(0); });
  document.addEventListener("visibilitychange", ()=>{ cancelAnimationFrame(raf); if (!document.hidden && !reduce) raf = requestAnimationFrame(draw); });
})();

const SAVE_VER = 2;
const LS_SAVE = "q53_save", LS_BAK = "q53_save_bak", LS_BROKEN = "q53_save_broken";

function blankSave(){
  return {ver:SAVE_VER, created:nowISO(), updatedAt:"1970-01-01T00:00:00.000Z",
    hero:{name:"", exp:0},
    flags:{prologue:false, ending:0, trueEnd:false},
    stages:{}, q:{}, gotW:[], runs:[], days:[],
    stats:{answers:0, correct:0, crit:0, maxCombo:0, wins:0, losses:0},
    set:{sound:true, bgm:true}};
}
// どんな形のセーブでも、足りない所を補う。知らないフィールドは残す。
function normalize(o){
  const b = blankSave();
  if (!isObj(o)) return b;
  const s = Object.assign({}, o);
  s.ver = Math.max(SAVE_VER, Number(o.ver)||0);
  s.created = typeof o.created==="string" ? o.created : b.created;
  s.updatedAt = typeof o.updatedAt==="string" ? o.updatedAt : b.updatedAt;
  for (const k of ["hero","flags","stats","set"]) s[k] = Object.assign({}, b[k], isObj(o[k]) ? o[k] : {});
  s.hero.exp = Math.max(0, Number(s.hero.exp)||0);
  s.hero.name = typeof s.hero.name==="string" ? s.hero.name.slice(0,12) : "";
  s.stages = {};
  if (isObj(o.stages)) for (const k in o.stages) if (isObj(o.stages[k])) s.stages[k] = Object.assign({}, o.stages[k]);
  s.q = {};
  if (isObj(o.q)) for (const k in o.q){ const r = o.q[k]; if (isObj(r)) s.q[k] = Object.assign({}, r, {o:+r.o||0, n:+r.n||0, s:+r.s||0, t:+r.t||0}); }
  s.gotW = Array.isArray(o.gotW) ? o.gotW.map(Number).filter(Number.isFinite) : [];
  s.runs = Array.isArray(o.runs) ? o.runs.filter(isObj).map(r=>Object.assign({}, r)) : [];
  s.days = Array.isArray(o.days) ? o.days.filter(d=>typeof d==="string") : [];
  return s;
}
const MIGRATE = {
  1: o=>fromV1(o),   // v1 {runs, updatedAt} → v2
};
function upgrade(o){
  if (!isObj(o)) return null;
  let cur = o, v = Number(o.ver)||1, guard = 0;
  while (v < SAVE_VER && MIGRATE[v] && guard++ < 20){ cur = MIGRATE[v](cur); v = Number(cur.ver)||v+1; }
  return normalize(cur);
}
// soft = 同じ戦いの中での「もう一度」。正解しても サビは落ちない（次の戦いで正解して落とす）
function applyRec(s, k, ok, day, soft){
  const r = s.q[k] || (s.q[k] = {o:0, n:0, s:0, t:0});
  if (ok){ r.o++; if (!soft) r.s++; } else { r.n++; r.s = 0; }
  r.t = day;
  return r;
}
function addDay(s, k){ if (!s.days.includes(k)) s.days.push(k); }
// v1 の冒険記録から、武器・章クリア・経験値を復元する
function fromV1(old){
  const s = blankSave();
  const runs = (Array.isArray(old.runs) ? old.runs : []).filter(r=>isObj(r) && r.at).slice().sort((a,b)=>tms(a.at)-tms(b.at));
  s.runs = runs.map(r=>Object.assign({}, r));
  s.updatedAt = typeof old.updatedAt==="string" ? old.updatedAt : (runs.length ? runs[runs.length-1].at : s.updatedAt);
  if (runs.length) s.created = runs[0].at;
  let prevMiss = [];
  for (const r of runs){
    const day = dayNum(r.at); addDay(s, dayKey(r.at));
    const missK = (Array.isArray(r.missK) ? r.missK : []).filter(validKey);
    const miss = new Set(missK);
    let asked = [];
    if (r.mode==="stage" && stageOf(r.stage)) asked = stageKeys(r.stage);
    else if (r.mode==="weak") asked = prevMiss;
    asked.forEach(k=>{ if (!miss.has(k)) applyRec(s, k, true, day); });
    missK.forEach(k=>applyRec(s, k, false, day));
    if (r.mode==="all"){
      const mw = new Set((Array.isArray(r.missW) ? r.missW : []).map(Number));
      W.forEach(w=>{ if (!mw.has(w.id) && !s.gotW.includes(w.id)) s.gotW.push(w.id); });
      STAGES.forEach(st=>{
        const n = W.filter(w=>w.st===st.id).length;
        const m = missK.filter(k=>W[itemOf(k).w-1].st===st.id).length;
        v1Clear(s, st.id, n, m, null);
      });
    }
    if (r.mode==="stage" && stageOf(r.stage)) v1Clear(s, r.stage, asked.length, miss.size, Number(r.ms)||null);
    s.hero.exp += (Number(r.first)||0)*10;
    s.stats.answers += Number(r.total)||0;
    s.stats.correct += Number(r.first)||0;
    s.stats.maxCombo = Math.max(s.stats.maxCombo, Number(r.maxCombo)||0);
    prevMiss = missK;
  }
  s.flags.fromV1 = runs.length;
  try{ if (localStorage.getItem(LS_SOUND_V1)==="off") s.set.sound = false; }catch(e){}
  return s;
}
// v1 でボスを「たおした」（その章でミス0）なら、その章はクリア（★3）として引き継ぐ。
// ミスがあった章は v1 でもボスが「にげだした」ので、未クリアのまま（武器・経験値・サビは引き継ぐ）。
function v1Clear(s, id, n, m, ms){
  const st = s.stages[id] = Object.assign({clear:0, stars:0, tries:0, best:null, score:0}, s.stages[id]);
  st.tries++;
  if (n > 0 && m === 0){
    st.clear++; st.stars = 3;
    if (ms) st.best = st.best==null ? ms : Math.min(st.best, ms);
  }
}
function mergeMax(x, y){
  const z = Object.assign({}, x, y);
  for (const k in x) if (k in y){
    if (typeof x[k]==="number" && typeof y[k]==="number") z[k] = Math.max(x[k], y[k]);
    else if (typeof x[k]==="boolean" && typeof y[k]==="boolean") z[k] = x[k] || y[k];
  }
  return z;
}
const runKey = r=>String(r.at)+"|"+String(r.mode)+"|"+String(r.ms);
// 2つのセーブを合体。進み具合は「多い方・良い方」を必ず残す。
function mergeSaves(a, b){
  if (!a) return b; if (!b) return a;
  const [o, n] = tms(a.updatedAt) <= tms(b.updatedAt) ? [a, b] : [b, a];
  const m = Object.assign({}, o, n);
  m.ver = Math.max(a.ver, b.ver);
  m.created = (tms(a.created) && tms(b.created)) ? (tms(a.created) < tms(b.created) ? a.created : b.created) : (a.created || b.created);
  m.updatedAt = n.updatedAt;
  m.hero = Object.assign({}, o.hero, n.hero, {exp:Math.max(a.hero.exp, b.hero.exp), name:n.hero.name || o.hero.name});
  m.flags = mergeMax(o.flags, n.flags);
  m.stats = mergeMax(o.stats, n.stats);
  m.set = Object.assign({}, o.set, n.set);
  m.stages = {};
  for (const k of new Set([...Object.keys(a.stages), ...Object.keys(b.stages)])){
    const x = a.stages[k], y = b.stages[k];
    if (!x || !y){ m.stages[k] = Object.assign({}, x || y); continue; }
    const z = mergeMax(x, y);
    const bs = [x.best, y.best].filter(v=>typeof v==="number" && v>0);
    z.best = bs.length ? Math.min(...bs) : null;
    m.stages[k] = z;
  }
  m.q = {};
  for (const k of new Set([...Object.keys(a.q), ...Object.keys(b.q)])){
    const x = a.q[k], y = b.q[k];
    if (!x || !y){ m.q[k] = Object.assign({}, x || y); continue; }
    const cx = x.o+x.n, cy = y.o+y.n;
    m.q[k] = Object.assign({}, (cx > cy || (cx===cy && x.t >= y.t)) ? x : y);
  }
  m.gotW = [...new Set([...a.gotW, ...b.gotW])].sort((p,q)=>p-q);
  const seen = new Map();
  [...o.runs, ...n.runs].forEach(r=>seen.set(runKey(r), r));
  m.runs = [...seen.values()].sort((p,q)=>tms(p.at)-tms(q.at)).slice(-RUNS_MAX);
  m.days = [...new Set([...a.days, ...b.days])].sort().slice(-DAYS_MAX);
  return m;
}
const stable = s=>JSON.stringify(Object.assign({}, s, {updatedAt:0}));

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

// 1日1回、起動時のセーブを3日分とっておく（万一こわれた時の保険）
function backupLocal(raw){
  let bak = {};
  try{ const b = JSON.parse(lsGet(LS_BAK)||"{}"); if (isObj(b)) bak = b; }catch(e){}
  const today = dayKey(new Date());
  if (bak[today]) return;
  bak[today] = raw;
  const keys = Object.keys(bak).sort();
  while (keys.length > 3) delete bak[keys.shift()];
  lsSet(LS_BAK, JSON.stringify(bak));
}
function loadLocal(){
  let s = null;
  const raw = lsGet(LS_SAVE);
  if (raw){
    try{ s = upgrade(JSON.parse(raw)); }catch(e){ s = null; }
    if (s) backupLocal(raw);
    else {
      lsSet(LS_BROKEN, raw);
      try{ const bak = JSON.parse(lsGet(LS_BAK)||"{}"); const ks = Object.keys(bak).sort().reverse();
        for (const k of ks){ try{ s = upgrade(JSON.parse(bak[k])); if (s) break; }catch(e){} } }catch(e){}
    }
  }
  const v1raw = lsGet(LS_V1);
  if (v1raw){
    try{ const v1 = JSON.parse(v1raw); if (isObj(v1) && Array.isArray(v1.runs) && v1.runs.length) s = mergeSaves(s || blankSave(), upgrade(v1)); }catch(e){}
  }

}

async function flushCloud(){
  clearTimeout(cloudTimer); cloudTimer = null;
  if (!cloud || cloudBusy || !cloudDirty) return;
  cloudBusy = true; cloudDirty = false; cloudState = "sync";
  try{
    const snap = await cloud.ref.get();
    if (snap && snap.exists){ const inc = upgrade(clone(snap.data())); if (inc){ save = mergeSaves(save, inc); saveLocal(); } }
    await cloud.ref.set(clone(save));
    cloudState = "ok";
  }catch(e){
    const code = e && e.code;
    if (["revoked","not_granted","capability_disabled","capability_removed","invalid_argument","quota_exceeded"].includes(code)){ cloud = null; cloudState = "off"; }
    else { cloudDirty = true; cloudState = "retry"; }
  }
  cloudBusy = false;
  if (cloud && cloudDirty) cloudTimer = setTimeout(flushCloud, 8000);
}

function stateOf(k){ const r = save.q[k]; if (!r || (r.o+r.n)===0) return "new"; if (r.s===0) return "rust"; if (r.s>=2) return "gold"; return "ok"; }
const PRIO = {rust:0, new:1, ok:2, gold:3};
function wStars(w){
  const recs = live(w).map(x=>save.q[K(w.id, x.v)]);
  const any = recs.some(r=>r && r.o>0) || save.gotW.includes(w.id);
  if (!any) return 0;
  if (recs.every(r=>r && r.s>=2)) return 3;
  if (recs.every(r=>r && r.s>=1)) return 2;
  return 1;
}
function wRust(w){ return live(w).some(x=>stateOf(K(w.id, x.v))==="rust"); }
function rustKeys(){ const out=[]; W.forEach(w=>live(w).forEach(x=>{ const k=K(w.id,x.v); if (stateOf(k)==="rust") out.push(k); })); return out; }

function streak(){
  const days = new Set(save.days);
  let n=0; const d=new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while (days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }

}

// 武器ごとに「サビ→初めて→1回正解→伝説」の順で選び、なるべく多くの武器から出す
function pickFrom(ws, k){
  const lists = shuffle(ws.slice()).map(w=>shuffle(live(w).map(x=>({w:w.id, v:x.v, p:PRIO[stateOf(K(w.id,x.v))]}))).sort((a,b)=>a.p-b.p));
  const out = [];
  for (let round=0; out.length<k; round++){
    const layer = lists.map(l=>l[round]).filter(Boolean);
    if (!layer.length) break;
    shuffle(layer).sort((a,b)=>a.p-b.p).forEach(it=>{ if (out.length<k) out.push({w:it.w, v:it.v}); });
  }
  return out;
}

function blip(A, f, d, t, type, vol, dest){
  const o = A.createOscillator(), g = A.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+0.03);
}

const midi = n=>440*Math.pow(2, (n-69)/12);
function bgm(name, rate){
  rate = rate || 1;
  if (BGM.name===name && BGM.rate===rate && BGM.timer) return;
  bgmStop(); BGM.name = name; BGM.rate = rate;
  bgmStart();
}
function bgmStart(){
  if (!BGM.name || BGM.timer || !save.set.bgm || document.hidden) return;
  const A = ac(); if (!A) return;
  BGM.out = A.createGain(); BGM.out.gain.value = 1; BGM.out.connect(A.destination);
  BGM.step = 0; BGM.nextT = A.currentTime + 0.08;
  BGM.timer = setInterval(bgmTick, 60); bgmTick();
}
function bgmTick(){
  const S = SONGS[BGM.name]; if (!S || !AC || !BGM.out) return;
  const spb = 60/(S.bpm*BGM.rate)/2;
  if (BGM.nextT < AC.currentTime) BGM.nextT = AC.currentTime + 0.02;
  while (BGM.nextT < AC.currentTime + 0.25){
    const i = BGM.step % S.mel.length, m = S.mel[i], b = S.bass[i % S.bass.length];
    try{
      if (m) blip(AC, midi(m), spb*0.85, BGM.nextT, S.lead, S.lv, BGM.out);
      if (b) blip(AC, midi(b), spb*0.9, BGM.nextT, "triangle", S.bv, BGM.out);
    }catch(e){}
    BGM.nextT += spb; BGM.step++;
  }
}
function bgmStop(keepName){
  clearInterval(BGM.timer); BGM.timer = null;
  if (BGM.out && AC){ const g = BGM.out; try{ g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05); }catch(e){} setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 400); }
  BGM.out = null;
  if (!keepName) BGM.name = null;
}

function makeRun(kind, arg){
  const lv = lvInfo(save.hero.exp).lv;
  let items = [], meta, hearts = Infinity, requeue = true;
  if (kind==="stage"){ meta = stageOf(arg); items = pickFrom(W.filter(w=>w.st===meta.id), meta.n); hearts = heartsFor(items.length, lv); }
  else if (kind==="final"){ meta = FINAL; STAGES.forEach(s=>items.push(...pickFrom(W.filter(w=>w.st===s.id), QUOTA[s.id]))); hearts = FINAL_HEARTS; requeue = false; }
  else if (kind==="rust"){ meta = TRAIN.rust; items = shuffle(rustKeys().map(itemOf)).slice(0, 20); }
  else if (kind==="train"){ meta = TRAIN.train; items = pickFrom(W, 20); }
  else if (kind==="forge"){ const w = W[arg-1]; if (!w) return null; meta = Object.assign({}, TRAIN.forge, {name:w.n}); items = live(w).map(x=>({w:w.id, v:x.v})); }
  if (!meta || !items.length) return null;
  items = shuffle(items);
  const bossHp = kind==="final" ? FINAL_HP : items.length;
  const startStars = W.map(w=>wStars(w));
  return {kind, arg, meta, items, idx:0, N:items.length, bossHp, bossMax:bossHp, hearts, heartsMax:hearts, requeue,
    combo:0, maxCombo:0, score:0, crits:0, first:0, asked:0, missK:[], missCount:0,
    t0:performance.now(), qStart:0, critMs:0, answered:true, over:false,
    phase2:false, halfSaid:false, pinchSaid:false, fever:false, expGain:0, lv0:lv, startStars, curStars:startStars.slice()};
}
function startBattle(kind, arg){

function answer(val){
  if (!run || run.answered || run.over) return;
  run.answered = true; setButtons(false);
  const it = run.items[run.idx], w = W[it.w-1], s = w.s[it.v], key = K(it.w, it.v);
  const ok = val === s.a, crit = ok && (performance.now()-run.qStart) <= run.critMs;
  run.asked++;
  record(key, ok, !!it.retry);
  if (ok){
    if (!it.retry) run.first++;
    run.combo++; run.maxCombo = Math.max(run.maxCombo, run.combo);
    if (crit){ run.crits++; save.stats.crit++; }
    const wasFever = run.fever; run.fever = run.combo >= 5;
    let pts = 100 + 10*Math.min(run.combo, 30) + (crit?100:0);
    if (run.fever) pts *= 2;
    run.score += pts;
    run.bossHp = Math.max(0, run.bossHp-1);
    gainExp(crit ? 15 : 10, true);
    slash(crit); animMon("hit"); popText((crit?"会心！ +":"+") + pts, crit?"crit":""); burst(crit?16:8, crit?null:"#ffffff");
    if (crit){ quake(); SFX.crit(); } else SFX.hit();
    if (run.fever && !wasFever){ $("#arena").classList.add("fever"); later(SFX.fever, 140); }
    else if (run.combo%5===0) later(SFX.combo, 140);
    checkWeapon(it.w);
  } else {
    run.combo = 0;
    if (run.fever){ run.fever = false; $("#arena").classList.remove("fever"); }
    run.missCount++;
    if (!run.missK.includes(key)) run.missK.push(key);
    if (Number.isFinite(run.hearts)) run.hearts = Math.max(0, run.hearts-1);
    if (run.requeue) run.items.push({w:it.w, v:it.v, retry:true});

  }
  save.stats.maxCombo = Math.max(save.stats.maxCombo, run.maxCombo);

}

function finish(won){
  clearSeq(); clearInterval(clock);
  const r = run, ms = Math.round(performance.now()-r.t0);
  const key = r.kind==="final" ? "final" : r.kind==="stage" ? String(r.arg) : null;
  let stars = 0, firstClear = false, newBest = false, newScore = false, bonus = 0;
  if (key){
    const st = save.stages[key] = Object.assign({clear:0, stars:0, tries:0, best:null, score:0}, save.stages[key]);
    st.tries++;
    if (won){
      stars = starsFor(r.hearts, r.heartsMax);
      firstClear = !st.clear; st.clear++;
      if (stars > st.stars) st.stars = stars;
      if (st.best==null || ms < st.best){ newBest = st.best!=null; st.best = ms; }
      bonus = (r.kind==="final" ? 300 : 50) + stars*25;
    }
    if (r.score > (st.score||0)){ newScore = (st.score||0) > 0; st.score = r.score; }
    st.lastAt = nowISO();
  } else if (won) bonus = 20;
  const lvFrom = r.lv0;
  if (bonus) gainExp(bonus, false);
  if (won) save.stats.wins++; else save.stats.losses++;
  const now = W.map(w=>wStars(w));
  const gotNew = W.filter((w,i)=>r.startStars[i]===0 && now[i]>0).map(w=>w.id);
  const upgraded = W.filter((w,i)=>r.startStars[i]>0 && now[i]>r.startStars[i]).map(w=>w.id);
  const rec = {at:nowISO(), mode:r.kind, stage:r.kind==="stage" ? r.arg : null, total:r.N, first:r.first, ms, score:r.score, maxCombo:r.maxCombo,
    missK:r.missK.slice(), missW:[...new Set(r.missK.map(k=>itemOf(k).w))], win:won, stars, crits:r.crits};
  if (r.kind==="forge") rec.w = r.arg;
  save.runs.push(rec);
  if (save.runs.length > RUNS_MAX) save.runs = save.runs.slice(-RUNS_MAX);
  let trueEnd = false;
  if (!save.flags.trueEnd && W.every(w=>wStars(w)===3)){ save.flags.trueEnd = true; trueEnd = true; }
  const firstEnding = r.kind==="final" && won && !save.flags.ending;
  if (r.kind==="final" && won) save.flags.ending = (save.flags.ending||0) + 1;
  r.result = {won, ms, stars, firstClear, newBest, newScore, bonus, gotNew, upgraded, trueEnd, lvFrom, lvTo:lvInfo(save.hero.exp).lv};
  markDirty(); flushSoon();
  if (firstEnding) startEnding(); else show("result");
}

/* ---------- result ---------- */
function renderResult(){
  const r = run, R = r && r.result;
  if (!R){ show("home"); return; }
  bgmStop();
  const isBoss = r.kind==="stage" || r.kind==="final";
  const L = lvInfo(save.hero.exp);
  const title = R.won ? (r.kind==="final" ? "魔王討伐！" : isBoss ? "ステージクリア" : "修行かんりょう") : "ちからつきた…";
  const misses = r.missK.map(k=>{ const {w,v} = itemOf(k); return {w:W[w-1], s:W[w-1].s[v]}; });
  const chips = (ids, cls)=>ids.map(id=>`<span class="chip ${cls}" data-sw="${id}">${esc(W[id-1].n)}</span>`).join("");
  const badges = [R.firstClear?'<span class="badge gold">初クリア！</span>':"", R.newBest?'<span class="badge">ベストタイム更新！</span>':"", R.newScore?'<span class="badge">ハイスコア更新！</span>':""].join("");
  app.innerHTML = `
    <section class="win rank ${R.won?"":"lose"}" aria-label="結果">
      <span class="lbl">${R.won?"VICTORY":"GAME OVER"}</span>
      <span class="name">${title}</span>
      ${isBoss && R.won ? `<span class="bigstars" id="bigstars" aria-label="星${R.stars}つ"><span>★</span><span>★</span><span>★</span></span>` : ""}
      ${badges?`<div class="badges">${badges}</div>`:""}
      ${R.won ? "" : `<p class="cheer">まちがえた文は サビとして 武器庫に残った。<br>サビを落とせば、次は 勝てる！</p>`}
    </section>
    ${R.trueEnd?`<section class="win theend"><div class="big" style="font-size:34px">TRUE END</div><p class="cheer">53の武器が すべて 伝説の輝きを 放った。<br>${esc(heroName())}は「伝説の宅建士」と 呼ばれるように なった。</p></section>`:""}
    <section class="win">
      <span class="win-title">けっか</span>
      <div class="grid4 num">
        <div class="cell"><div class="k">一発正解</div><div class="v">${r.first}<small>/ ${r.N}</small></div></div>
        <div class="cell"><div class="k">タイム</div><div class="v">${fmt(R.ms)}</div></div>
        <div class="cell"><div class="k">スコア</div><div class="v" style="color:var(--gold)" id="sc">0</div></div>
        <div class="cell"><div class="k">最大コンボ ／ 会心</div><div class="v">${r.maxCombo}<small>／ ${r.crits}</small></div></div>
      </div>
    </section>
    <section class="win lvrow">
      <span class="win-title">けいけんち</span>
      <div class="l"><b>Lv.${L.lv}　${titleFor(L.lv)}</b><span class="num">+${comma(r.expGain + R.bonus)} EXP</span></div>
      <div class="expbar"><i style="width:${(L.cur/L.need*100).toFixed(1)}%"></i></div>
      ${R.lvTo > R.lvFrom ? `<span class="up pix">LEVEL UP!　Lv.${R.lvFrom} → Lv.${R.lvTo}</span>` : ""}
    </section>
    ${R.gotNew.length||R.upgraded.length?`<section class="win sect"><span class="win-title">武器</span>
      ${R.gotNew.length?`<p>手に入れた武器</p><div class="chips">${chips(R.gotNew,"")}</div>`:""}
      ${R.upgraded.length?`<p>強くなった武器</p><div class="chips">${chips(R.upgraded,"up")}</div>`:""}</section>`:""}
    ${misses.length?`<section class="win"><span class="win-title">まちがえた文（サビ落としに 出ます）</span><div class="misses">${misses.map(m=>`
      <div class="mi"><span class="w">【${esc(m.w.n)}】</span><span class="s">${esc(m.s.t)}</span><span class="a">答え ${m.s.a?"○":"✕"}　${esc(m.s.e)}</span></div>`).join("")}</div></section>`
      : R.won ? `<p class="cheer">ノーミス！ 完璧です！</p>` : ""}
    <div class="row" id="btns"></div>`;
  $$("[data-sw]").forEach(el=>el.prepend(swordFor(W[el.dataset.sw-1], 1)));
  const sc = $("#sc"), target = r.score, t0 = performance.now();
  (function count(t){ const p = Math.min(1, (t-t0)/900); sc.textContent = comma(Math.round(target*p)); if (p<1) requestAnimationFrame(count); })(t0);
  if (R.won){ SFX.fanfare(); const st = $$("#bigstars span"); for (let i=0;i<R.stars;i++) later(()=>{ st[i].className = "on"; SFX.star(); }, 700 + i*380); }
  const btns = [];
  if (R.won && r.kind==="stage"){
    const un = STAGES.find(s=>!cleared(s.id));
    if (un) btns.push(["cta", `つぎへ ▶ ${un.name}`, ()=>goStage(un.id)]);
    else if (!cleared("final")) btns.push(["cta", "魔王城へ！", ()=>goStage("final")]);
  }
  if (!R.won) btns.push(["cta", "リベンジ！", ()=>startBattle(r.kind, r.arg)]);
  else btns.push(["btn2", "もう一度", ()=>startBattle(r.kind, r.arg)]);
  const rk = rustKeys().length;
  if (rk && r.kind!=="rust") btns.push(["btn2", `サビ落とし（${rk}）`, ()=>startBattle("rust")]);
  else if (rk && r.kind==="rust") btns.push(["btn2", `つづけて落とす（${rk}）`, ()=>startBattle("rust")]);
  btns.push(["btn2", "マップへ", ()=>show("home")]);
  const box = $("#btns");
  btns.forEach(([cls, label, fn])=>{ const b = document.createElement("button"); b.className = cls; b.textContent = label; if (cls==="cta"){ b.style.fontSize = "22px"; b.style.flexBasis = "100%"; } b.onclick = fn; box.appendChild(b); });
}

/* ---------- armory ---------- */

}
function renderWeapon(){
  const w = W[ctx.w-1]; if (!w){ show("armory"); return; }

    <div class="bar"><button class="mini" id="back">◀ 武器庫</button></div>

/* ---------- menu ---------- */
const MODE_NAME = {all:"本編(旧)", weak:"特訓(旧)", mix:"ランダム(旧)", rust:"サビ落とし", train:"修行", forge:"鍛冶場", final:"魔王城"};
function runName(r){ if (r.mode==="stage") return (stageOf(r.stage)||{}).name || "章"; if (r.mode==="forge" && W[r.w-1]) return "鍛冶：" + W[r.w-1].n; return MODE_NAME[r.mode] || String(r.mode); }
function renderMenu(){
  bgm("map");
  const L = lvInfo(save.hero.exp), S = save.stats;
  const acc = S.answers ? Math.round(S.correct/S.answers*100) : 0;
  const hist = save.runs.slice(-12).reverse();
  const cs = cloud ? (cloudState==="retry" ? "クラウド：つながり待ち" : "クラウド：保存中") : "クラウド：なし（この端末だけ）";
  app.innerHTML = `
    <div class="bar"><button class="mini" id="back">◀ もどる</button><h2>メニュー</h2></div>
    <section class="win sect"><span class="win-title">つよさ</span>
      <div class="kv num">
        <div><span>なまえ</span><b>${esc(heroName())}</b></div>
        <div><span>レベル</span><b>Lv.${L.lv} ${titleFor(L.lv)}</b></div>
        <div><span>けいけんち</span><b>${comma(Math.floor(save.hero.exp))}</b></div>
        <div><span>つぎのLvまで</span><b>${comma(L.need-L.cur)}</b></div>
        <div><span>正解 ／ 回答</span><b>${comma(S.correct)} / ${comma(S.answers)}</b></div>
        <div><span>正答率</span><b>${acc}%</b></div>
        <div><span>会心の一撃</span><b>${comma(S.crit)}</b></div>
        <div><span>最大コンボ</span><b>${S.maxCombo}</b></div>
        <div><span>勝ち ／ 負け</span><b>${S.wins} / ${S.losses}</b></div>
        <div><span>冒険した日</span><b>${save.days.length}日（連続${streak()}）</b></div>
      </div>
    </section>
    <section class="win"><span class="win-title">冒険の記録</span>
      ${hist.length?`<div class="rec num">${hist.map(r=>`<span>${dayKey(r.at).slice(5).replace("-","/")}</span><span class="m">${esc(runName(r))}</span><span class="${r.win===false?"ls":r.win?"wn":""}">${r.win===false?"負け":r.win?"勝ち":""} ${r.first}/${r.total}</span><span>${fmt(r.ms||0)}</span>`).join("")}</div>`:`<p class="empty">まだ記録はありません。</p>`}
    </section>
    <section class="win sect"><span class="win-title">ふっかつのじゅもん</span>
      <p>セーブは 自動です（この端末と、ログイン中ならクラウドにも）。<br>機種変更や 万一のために、じゅもんを メモしておけます。じゅもんを入力すると、今のセーブと <b>合体</b>します（進み具合が多い方が残ります）。</p>
      <div class="row"><button class="btn2" id="ex">じゅもんを表示</button><button class="btn2" id="im">じゅもんを入力</button></div>
      <div id="exbox" hidden class="sect">
        <textarea class="code" id="excode" readonly aria-label="ふっかつのじゅもん"></textarea>
        <button class="btn2" id="copy">コピー</button>
      </div>
      <form id="imbox" hidden class="sect">
        <textarea class="code" id="imcode" aria-label="じゅもんを貼りつけ" placeholder="Q53SAVE: から始まる じゅもんを 貼りつけ"></textarea>
        <button class="btn2" type="submit">読みこむ</button>
        <p class="note" id="immsg"></p>
      </form>
      <p class="note">${cs}${lastSaved?`　・　最終セーブ ${new Date(lastSaved).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}`:""}</p>
    </section>
    <section class="win sect"><span class="win-title">せってい</span>
      <div class="toggle"><span>効果音</span><button class="mini" id="t-snd">${save.set.sound?"ON":"OFF"}</button></div>
      <div class="toggle"><span>BGM</span><button class="mini" id="t-bgm">${save.set.bgm?"ON":"OFF"}</button></div>
      <form class="toggle" id="rn"><label for="rename">なまえ</label><input class="field" id="rename" maxlength="8" value="${esc(save.hero.name)}" placeholder="ゆうしゃ" style="font-size:16px;padding:6px 10px;max-width:180px"><button class="mini" type="submit">変える</button></form>
    </section>
    <section class="win sect"><span class="win-title">あそびかた</span>
      <ol class="howto">
        <li>文を読んで、正しければ ○、まちがいなら ✕。</li>

        <li>まちがえると ♥ が減り、その文は あとでもう一度 出る。♥ が0で ちからつきる。</li>
        <li>5つの章を クリアすると 魔王城の封印がとける。37問 正解すれば 魔王を倒せる。</li>
        <li>まちがえた文は「サビ」になる。サビ落としで 取りもどそう。</li>

      <p class="note">キーボード：○＝O か ←、✕＝X か →、つぎへ＝Enter</p>

    <div class="row">
      <button class="btn2" id="pro">プロローグを見る</button>

  $("#back").onclick = ()=>show("home");

  const eb = $("#end"); if (eb) eb.onclick = ()=>{ run = null; startEnding(); };
  $("#ex").onclick = ()=>{ $("#exbox").hidden = false; $("#imbox").hidden = true; $("#excode").value = makeCode(); };
  $("#im").onclick = ()=>{ $("#imbox").hidden = false; $("#exbox").hidden = true; $("#imcode").focus(); };
  $("#copy").onclick = ()=>{
    const ta = $("#excode");
    const fallback = ()=>{ ta.focus(); ta.select(); toast("全部 選びました。コピーしてください"); };
    try{ navigator.clipboard.writeText(ta.value).then(()=>toast("コピーしました"), fallback); }catch(e){ fallback(); }
  };
  $("#imbox").onsubmit = e=>{
    e.preventDefault();
    try{
      const inc = readCode($("#imcode").value);
      save = mergeSaves(save, inc);
      markDirty(); flushSoon(); SFX.get();
      toast("じゅもんが きいた！ セーブを 合体しました", "gold");
      renderMenu();
    }catch(err){ $("#immsg").textContent = "じゅもんが ちがうようです。最初から最後まで、まるごと 貼りつけてください。"; }

}
const CODE_PREFIX = "Q53SAVE:";
function toB64(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for (let i=0;i<bytes.length;i+=8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192)); return btoa(bin); }
function fromB64(b64){ const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function makeCode(){ return CODE_PREFIX + toB64(JSON.stringify(save)); }
function readCode(txt){
  const t = String(txt||"").trim();
  const obj = t.startsWith("{") ? JSON.parse(t) : JSON.parse(fromB64(t.replace(/^Q53SAVE:/, "").replace(/\s+/g, "")));
  if (!isObj(obj) || !(obj.ver || Array.isArray(obj.runs))) throw new Error("not a save");
  return upgrade(obj);
}

/* ---------- keys ---------- */
document.addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if (view==="battle" && run){
    if (!run.answered){
      if (k==="o" || k==="arrowleft" || k==="z"){ e.preventDefault(); answer(true); }
      else if (k==="x" || k==="arrowright"){ e.preventDefault(); answer(false); }
    } else if ((k==="enter" || k===" ") && $("#msg .stamp")){ e.preventDefault(); next(); }
  } else if (view==="tale" && (k==="enter" || k===" ") && !(e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName))){
    const b = $("#box"); if (b && !b.hidden){ e.preventDefault(); b.click(); }
  }
});

/* ---------- boot ---------- */
save = loadLocal();
saveLocal();
render();
initCloud();
</script>
